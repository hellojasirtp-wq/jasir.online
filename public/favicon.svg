<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff" />
      <stop offset="100%" stop-color="#00ffb3" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00ffb3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#050816" stroke="url(#neonGrad)" stroke-width="2.5" filter="url(#glow)" />
  
  <!-- Left Terminal Tag/Bracket -->
  <path d="M15 24 L9 32 L15 40" stroke="#6c63ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
  
  <!-- Central Letter J -->
  <path d="M35 18 H27 V37 C27 41.5 22.5 42.5 19 41" stroke="url(#textGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Neon Dot/Period -->
  <circle cx="41" cy="39" r="3.5" fill="#00ffb3" filter="url(#glow)" />
  
  <!-- Right Terminal Tag/Bracket -->
  <path d="M49 24 L55 32 L49 40" stroke="#00ffb3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
</svg>