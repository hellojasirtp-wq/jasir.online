<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1326" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff" />
      <stop offset="100%" stop-color="#00ffb3" />
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00ffb3" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#neonBorder)" stroke-width="3" />

  <!-- Code Bracket Left < -->
  <path d="M16 25 L10 32 L16 39" stroke="#6c63ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />

  <!-- Main Bold "J" Character -->
  <path d="M37 18 H27 V36 C27 41 23 42.5 19 40.5" stroke="url(#letterGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Glowing Neon Dot / Period -->
  <circle cx="43" cy="39" r="4" fill="#00ffb3" />

  <!-- Code Bracket Right > -->
  <path d="M48 25 L54 32 L48 39" stroke="#00ffb3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />
</svg>